name: ingest

on:
  schedule:
    - cron: "0 6 * * 1"  # her pazartesi 06:00 UTC
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run ingestion (World Bank, keyless)
        run: python -m makroquest.ingest data/makroquest.db
      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: makroquest-db
          path: data/makroquest.db
          retention-days: 30

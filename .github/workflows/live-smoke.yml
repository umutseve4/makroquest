name: live-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # her pazartesi 06:17 UTC — canlı demo hâlâ ayakta mı?

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Canlı deploy smoke testi
        run: python -u scripts/live_smoke.py https://makroquest.onrender.com

name: live-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/live_smoke.py"
      - ".github/workflows/live-smoke.yml"
  schedule:
    - cron: "17 6 * * 1" # her pazartesi 06:17 UTC — canlı demo hâlâ ayakta mı?

permissions:
  contents: read
  pull-requests: write

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canlı deploy smoke testi
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          python -u scripts/live_smoke.py https://makroquest.onrender.com 2>&1 | tee smoke.log
          exit "${PIPESTATUS[0]}"
      - name: Sonucu PR'a yorumla
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### live-smoke sonucu (${{ steps.smoke.outcome }})"
            echo '```'
            cat smoke.log
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file comment.md
      - name: Smoke FAIL ise job'ı düşür
        if: steps.smoke.outcome == 'failure'
        run: exit 1

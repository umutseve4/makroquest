name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        id: install
        continue-on-error: true
        run: pip install -e ".[dev]" 2>&1 | tee install.log; exit "${PIPESTATUS[0]}"
      - name: Lint
        id: lint
        continue-on-error: true
        run: ruff check . 2>&1 | tee lint.log; exit "${PIPESTATUS[0]}"
      - name: Tests
        id: tests
        continue-on-error: true
        run: pytest 2>&1 | tee tests.log; exit "${PIPESTATUS[0]}"
      - name: Eval
        id: eval
        continue-on-error: true
        run: python -m makroquest.eval 2>&1 | tee eval.log; exit "${PIPESTATUS[0]}"
      - name: Adim sonuclarini PR'a yorumla (teshis)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### CI test job teshis raporu"
            echo "| adim | sonuc |"
            echo "|------|-------|"
            echo "| Install | ${{ steps.install.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Tests | ${{ steps.tests.outcome }} |"
            echo "| Eval | ${{ steps.eval.outcome }} |"
            for f in install lint tests eval; do
              if [ -f "$f.log" ]; then
                echo ""
                echo "<details><summary>$f.log (son 60 satir)</summary>"
                echo ""
                echo '```'
                tail -n 60 "$f.log"
                echo '```'
                echo "</details>"
              fi
            done
          } > ci-report.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file ci-report.md
      - name: Herhangi bir adim FAIL ise job'u dusur
        if: >
          steps.install.outcome == 'failure' ||
          steps.lint.outcome == 'failure' ||
          steps.tests.outcome == 'failure' ||
          steps.eval.outcome == 'failure'
        run: exit 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t makroquest:ci .
      - name: Smoke test (non-editable kurulum + MAKROQUEST_DATA_DIR)
        run: |
          docker run -d --rm -p 7860:7860 --name mq makroquest:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:7860/health > /dev/null && break
            sleep 1
          done
          echo "== /health =="
          curl -fs http://localhost:7860/health
          echo
          echo "== /case listesi =="
          curl -fs http://localhost:7860/case | grep -q kasim-2021
          echo "case listesi OK"
          echo "== vaka akisi =="
          SID=$(curl -fs -X POST http://localhost:7860/case/kasim-2021/start \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['session_id'])")
          curl -fs "http://localhost:7860/case/session/$SID/score" > /dev/null
          echo "vaka akisi OK"
          echo "== /retrieve =="
          curl -fs "http://localhost:7860/retrieve?q=doviz%20kuru&k=3" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['results'],'bos sonuc';print('retrieve OK,',len(d['results']),'sonuc')"
          docker stop mq

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Eval
        run: python -m makroquest.eval

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t makroquest:ci .
      - name: Smoke test (non-editable kurulum + MAKROQUEST_DATA_DIR)
        run: |
          docker run -d --rm -p 7860:7860 --name mq makroquest:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:7860/health > /dev/null && break
            sleep 1
          done
          echo "== /health =="
          curl -fs http://localhost:7860/health
          echo
          echo "== /case listesi =="
          curl -fs http://localhost:7860/case | grep -q kasim-2021
          echo "case listesi OK"
          echo "== vaka akisi =="
          SID=$(curl -fs -X POST http://localhost:7860/case/kasim-2021/start \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['session_id'])")
          curl -fs "http://localhost:7860/case/session/$SID/score" > /dev/null
          echo "vaka akisi OK"
          echo "== /retrieve =="
          curl -fs "http://localhost:7860/retrieve?q=doviz%20kuru&k=3" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['results'],'bos sonuc';print('retrieve OK,',len(d['results']),'sonuc')"
          docker stop mq
